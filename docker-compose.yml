services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-inmobiliario-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_inmobiliario
    volumes:
      - erp_inmobiliario_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_inmobiliario"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  erp_inmobiliario_pg:
